<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="100%" height="100%">
  <!-- Outer Double-Tracked Loops -->
  <g fill="none" stroke-linecap="round">
    <!-- Top-Left Loop -->
    <circle cx="240" cy="240" r="185" stroke="#000000" stroke-width="38" />
    <circle cx="240" cy="240" r="185" stroke="#ffffff" stroke-width="18" />
    
    <!-- Top-Right Loop -->
    <circle cx="760" cy="240" r="185" stroke="#000000" stroke-width="38" />
    <circle cx="760" cy="240" r="185" stroke="#ffffff" stroke-width="18" />
    
    <!-- Bottom-Left Loop -->
    <circle cx="240" cy="760" r="185" stroke="#000000" stroke-width="38" />
    <circle cx="240" cy="760" r="185" stroke="#ffffff" stroke-width="18" />
    
    <!-- Bottom-Right Loop -->
    <circle cx="760" cy="760" r="185" stroke="#000000" stroke-width="38" />
    <circle cx="760" cy="760" r="185" stroke="#ffffff" stroke-width="18" />
  </g>

  <!-- Outer White Diamond with Black Border -->
  <polygon points="500,15 985,500 500,985 15,500" fill="#ffffff" stroke="#000000" stroke-width="12" stroke-linejoin="miter" />

  <!-- Inner Black Diamond -->
  <polygon points="500,125 875,500 500,875 125,500" fill="#000000" />

  <!-- Center White "P" (Vector Path) -->
  <path fill="#ffffff" fill-rule="evenodd" d="
    M 380,335 
    H 535 
    C 610,335 655,378 655,442.5 
    C 655,507 610,550 535,550 
    H 458 
    V 665 
    H 380 
    Z 
    M 458,400 
    V 485 
    H 525 
    C 560,485 578,468 578,442.5 
    C 578,417 560,400 525,400 
    Z" />
</svg>